<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <!-- Gold Gradient for Logo Icon & Text -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9E8B2"/>
      <stop offset="30%" stop-color="#E5C16C"/>
      <stop offset="70%" stop-color="#C59A3F"/>
      <stop offset="100%" stop-color="#9E7627"/>
    </linearGradient>

    <!-- Warm Rose Highlight for Lotus Core -->
    <linearGradient id="roseCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7597"/>
      <stop offset="50%" stop-color="#D9265B"/>
      <stop offset="100%" stop-color="#941238"/>
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON SECTION (x: 10 to 110, y: 10 to 110) -->
  <g transform="translate(15, 10)" filter="url(#subtleGlow)">
    <!-- Elegant Outer Halo Ring -->
    <circle cx="50" cy="50" r="46" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.6"/>
    <circle cx="50" cy="50" r="41" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4"/>

    <!-- Graceful Therapy Hand Contour (Reaching gently over the lotus) -->
    <path d="M 22 42 C 28 35, 42 27, 58 27 C 72 27, 84 34, 88 42 C 86 44, 81 44, 76 43 C 66 41, 54 41, 46 45 C 38 49, 32 54, 28 55 C 25 55, 23 52, 22 42 Z" fill="url(#goldGrad)"/>
    <path d="M 52 42 C 62 39, 74 41, 85 47 C 88 48, 86 52, 82 52 C 73 51, 64 47, 56 46 C 48 45, 41 49, 37 53 C 41 48, 46 44, 52 42 Z" fill="url(#goldGrad)" opacity="0.85"/>

    <!-- Central Blooming Lotus Blossom -->
    <!-- Center Teardrop Petal -->
    <path d="M 50 48 C 45 60, 44 72, 50 82 C 56 72, 55 60, 50 48 Z" fill="url(#roseCore)"/>
    <!-- Center Petal Spine -->
    <path d="M 50 52 L 50 78" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Left Lotus Petal -->
    <path d="M 47 57 C 38 65, 34 74, 40 82 C 45 80, 48 74, 49 68 C 49 63, 48 59, 47 57 Z" fill="url(#goldGrad)"/>
    
    <!-- Right Lotus Petal -->
    <path d="M 53 57 C 62 65, 66 74, 60 82 C 55 80, 52 74, 51 68 C 51 63, 52 59, 53 57 Z" fill="url(#goldGrad)"/>

    <!-- Left Outer Wing Petal -->
    <path d="M 42 67 C 31 71, 26 77, 33 83 C 38 83, 43 78, 44 73 Z" fill="url(#goldGrad)" opacity="0.75"/>

    <!-- Right Outer Wing Petal -->
    <path d="M 58 67 C 69 71, 74 77, 67 83 C 62 83, 57 78, 56 73 Z" fill="url(#goldGrad)" opacity="0.75"/>

    <!-- Lotus Base Pedestal Curve -->
    <path d="M 32 86 C 42 89, 58 89, 68 86 C 60 87.5, 40 87.5, 32 86 Z" fill="url(#goldGrad)"/>
    
    <!-- Delicate Spa Water Ripples -->
    <path d="M 28 91 C 40 94, 60 94, 72 91" stroke="url(#goldGrad)" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(135, 20)">
    <!-- "HÜRREM" Main Brand Name -->
    <text x="0" y="52" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="44" 
          font-weight="700" 
          letter-spacing="6" 
          fill="url(#goldGrad)">
      HÜRREM
    </text>

    <!-- Refined Divider Line -->
    <line x1="2" y1="67" x2="330" y2="67" stroke="url(#goldGrad)" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="166" cy="67" r="2.5" fill="url(#goldGrad)"/>

    <!-- "PREMIUM MASAJ &amp; SPA" Subtitle -->
    <text x="3" y="86" 
          font-family="'Manrope', 'Montserrat', 'Helvetica', sans-serif" 
          font-size="12.5" 
          font-weight="700" 
          letter-spacing="7" 
          fill="#FFFFFF" 
          opacity="0.9">
      PREMIUM MASAJ &amp; SPA
    </text>
  </g>
</svg>
