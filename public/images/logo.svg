<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" fill="none">
  <defs>
    <!-- Shimmering Champagne Gold Gradient -->
    <linearGradient id="massageGoldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7A6"/>
      <stop offset="35%" stop-color="#E5C16C"/>
      <stop offset="70%" stop-color="#C59B3C"/>
      <stop offset="100%" stop-color="#9C7423"/>
    </linearGradient>

    <!-- Subtle Drop Shadow for Contrast -->
    <filter id="massageGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- MASSAGE THERAPY HAND ICON -->
  <g transform="translate(10, 8)" filter="url(#massageGlow)">
    <!-- Therapeutic Hand Contour (Graceful massage stroke) -->
    <!-- Palm & Wrist Flow -->
    <path d="M 8 72 C 30 76, 68 82, 102 60 C 122 47, 142 32, 132 24 C 122 16, 96 22, 68 36 C 44 48, 22 58, 8 62" 
          stroke="url(#massageGoldLight)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Index Finger Stroke -->
    <path d="M 52 48 C 76 38, 108 34, 134 40 C 146 43, 148 50, 136 54 C 114 61, 88 64, 62 62" 
          stroke="url(#massageGoldLight)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Middle & Ring Finger Contours (Relaxing therapy touch) -->
    <path d="M 92 56 C 114 55, 138 58, 146 64 C 150 67, 145 72, 132 72 C 116 72, 100 68, 84 66" 
          stroke="url(#massageGoldLight)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

    <path d="M 98 68 C 114 69, 130 72, 138 78 C 141 81, 136 84, 126 84 C 114 84, 102 79, 90 76" 
          stroke="url(#massageGoldLight)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Warm Glowing Aroma / Energy Sparkle Drop -->
    <circle cx="152" cy="38" r="3.5" fill="url(#massageGoldLight)"/>
    <circle cx="160" cy="50" r="2" fill="url(#massageGoldLight)" opacity="0.75"/>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(185, 12)">
    <!-- "HÜRREM" - Bold, Majestic, Readable -->
    <text x="0" y="52" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="44" 
          font-weight="800" 
          letter-spacing="5" 
          fill="url(#massageGoldLight)">
      HÜRREM
    </text>

    <!-- Refined Divider Line -->
    <line x1="2" y1="67" x2="260" y2="67" stroke="url(#massageGoldLight)" stroke-width="1.2" stroke-opacity="0.5"/>
    <circle cx="131" cy="67" r="2.5" fill="url(#massageGoldLight)"/>

    <!-- "PREMIUM MASAJ & SPA" -->
    <text x="2" y="86" 
          font-family="'Manrope', 'Montserrat', 'Helvetica', sans-serif" 
          font-size="12.5" 
          font-weight="800" 
          letter-spacing="6.5" 
          fill="#FFFFFF" 
          opacity="0.95">
      PREMIUM MASAJ
    </text>
  </g>
</svg>
